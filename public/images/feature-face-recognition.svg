<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="10" fill="#eef6ff" />
  
  <!-- Photo Frame -->
  <rect x="40" y="40" width="120" height="120" rx="5" fill="white" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Face Recognition Elements -->
