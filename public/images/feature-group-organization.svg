<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="10" fill="#eef6ff" />
  
  <!-- Group of Photos -->
  <rect x="30" y="30" width="60" height="60" rx="4" fill="white" stroke="#cbd5e1" stroke-width="2" />
  <rect x="40" y="40" width="40" height="40" rx="20" fill="#e2e8f0" />
  
  <rect x="110" y="30" width="60" height="60" rx="4" fill="white" stroke="#cbd5e1" stroke-width="2" />
  <rect x="120" y="40" width="40" height="40" rx="20" fill="#e2e8f0" />
  
  <rect x="30" y="110" width="60" height="60" rx="4" fill="white" stroke="#cbd5e1" stroke-width="2" />
  <rect x="40" y="120" width="40" height="40" rx="20" fill="#e2e8f0" />
  
  <rect x="110" y="110" width="60" height="60" rx="4" fill="white" stroke="#cbd5e1" stroke-width="2" />
  <rect x="120" y="120" width="40" height="40" rx="20" fill="#e2e8f0" />
  
  <!-- Connection Lines -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="#3b7dff" stroke-width="2" stroke-dasharray="4 2" />
  <line x1="60" y1="140" x2="140" y2="140" stroke="#3b7dff" stroke-width="2" stroke-dasharray="4 2" />
  <line x1="60" y1="60" x2="60" y2="140" stroke="#3b7dff" stroke-width="2" stroke-dasharray="4 2" />
  <line x1="140" y1="60" x2="140" y2="140" stroke="#3b7dff" stroke-width="2" stroke-dasharray="4 2" />
  
  <!-- Group Label -->
  <rect x="75" y="85" width="50" height="30" rx="15" fill="#3b7dff" />
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Группа</text>
</svg>