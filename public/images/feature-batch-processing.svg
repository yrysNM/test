<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="10" fill="#eef6ff" />
  
  <!-- Stack of Photos -->
  <rect x="50" y="50" width="100" height="70" rx="4" fill="white" stroke="#cbd5e1" stroke-width="2" />
  <rect x="55" y="55" width="90" height="60" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <rect x="60" y="60" width="80" height="50" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Processing Arrows -->
  <path d="M100 130 L100 150" stroke="#3b7dff" stroke-width="2" />
  <path d="M95 145 L100 150 L105 145" stroke="#3b7dff" stroke-width="2" />
  
  <!-- Processing Result -->
  <rect x="60" y="150" width="80" height="20" rx="4" fill="white" stroke="#3b7dff" stroke-width="2" />
  
  <!-- Processing Icons -->
  <circle cx="75" cy="160" r="5" fill="#3b7dff" />
  <circle cx="90" cy="160" r="5" fill="#3b7dff" />
  <circle cx="105" cy="160" r="5" fill="#3b7dff" />
  <circle cx="120" cy="160" r="5" fill="#3b7dff" />
  
  <!-- Processing Status -->
  <rect x="70" y="30" width="60" height="10" rx="5" fill="#3b7dff" />
  <rect x="70" y="30" width="40" height="10" rx="5" fill="#1347e6" />
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0f172a">Обработка</text>
</svg>