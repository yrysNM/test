<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

        <link rel="stylesheet" href="./js/index.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Web site created using create-react-app" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />

        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

        <title>Заңғар ❤️ Bekzada</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root" class="fade-in"></div>
        <div id="falling-flower"></div>
        <script src="https://maps.api.2gis.ru/2.0/loader.js?pkg=full"></script>
        <script type="text/javascript">
            var map

            DG.then(function () {
                map = DG.map("map", {
                    center: [50.422325, 80.238337],
                    zoom: 16,
                    fullscreenControl: false,
                    zoomControl: false,
                })

                DG.marker([50.422325, 80.238337]).addTo(map)
            })
        </script>
        <script src="./js/sakura.js"></script>
        <script style="background-attachment: fixed">
            var sakura = new Sakura("#falling-flower", {
                fallSpeed: 0.5,
                colors: [
                    {
                        gradientColorStart: "rgba(255, 255, 253, 0.9)",
                        gradientColorEnd: "rgba(255, 255,  253, 0.9)",
                        gradientColorDegree: 120,
                    },
                    {
                        gradientColorStart: "rgba(44,  0)",
                        gradientColorEnd: "rgba(44,  0)",
                        gradientColorDegree: 120,
                    },
                    {
                        gradientColorStart: "rgba(44,  0)",
                        gradientColorEnd: "rgba(44, 0)",
                        gradientColorDegree: 120,
                    },
                ],
                delay: 40,
            })
        </script>
    </body>
</html>
