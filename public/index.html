<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

        <link rel="stylesheet" href="./js/index.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Web site created using create-react-app" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

        <!-- <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> -->
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

        <title>Заңғар ❤️ Bekzada</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root" class="fade-in"></div>
        <div id="falling-flower"></div>
        <script src="./js/sakura.js"></script>
        <script style="background-attachment: fixed">
            var sakura = new Sakura("#falling-flower", {
                fallSpeed: 0.5,
                colors: [
                    {
                        gradientColorStart: "rgb(252, 147, 180, 0.9)",
                        gradientColorEnd: "rgb(252, 147, 180,0.9)",
                        gradientColorDegree: 120,
                    },
                    {
                        gradientColorStart: "rgba(243, 217, 222, 0.5)",
                        gradientColorEnd: "rgba(243, 217, 222, 0.5)",
                        gradientColorDegree: 120,
                    },
                    {
                        gradientColorStart: "rgba(44,  0)",
                        gradientColorEnd: "rgba(44, 0)",
                        gradientColorDegree: 120,
                    },
                ],
                delay: 40,
            })
        </script>
    </body>
</html>
