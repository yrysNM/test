<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="#f8fafc" />
  
  <!-- App Interface -->
  <rect x="50" y="50" width="700" height="400" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- App Header -->
  <rect x="50" y="50" width="700" height="60" rx="8 8 0 0" fill="#f1f5f9" />
  <circle cx="85" cy="80" r="15" fill="#3b7dff" />
  <text x="110" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">ФотоПоиск</text>
  
  <!-- Search Bar -->
  <rect x="300" y="65" width="200" height="30" rx="15" fill="white" stroke="#cbd5e1" stroke-width="1" />
  <text x="320" y="85" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Поиск фотографий...</text>
  
  <!-- Main Content Area -->
  <rect x="70" y="130" width="660" height="300" rx="8" fill="#f8fafc" />
  
  <!-- Photo Grid -->
  <!-- Row 1 -->
  <rect x="90" y="150" width="150" height="120" rx="4" fill="#e2e8f0" />
  <rect x="260" y="150" width="150" height="120" rx="4" fill="#e2e8f0" />
  <rect x="430" y="150" width="150" height="120" rx="4" fill="#e2e8f0" />
  <rect x="600" y="150" width="110" height="120" rx="4" fill="#e2e8f0" />
  
  <!-- Row 2 -->
  <rect x="90" y="290" width="150" height="120" rx="4" fill="#e2e8f0" />
  <rect x="260" y="290" width="150" height="120" rx="4" fill="#e2e8f0" />
  <rect x="430" y="290" width="150" height="120" rx="4" fill="#e2e8f0" />
  <rect x="600" y="290" width="110" height="120" rx="4" fill="#e2e8f0" />
  
  <!-- Face Recognition Elements -->
  <!-- Photo 1 with Face Recognition -->
  <circle cx="165" cy="210" r="30" fill="none" stroke="#3b7dff" stroke-width="2" />
  <rect x="145" y="190" width="40" height="40" rx="20" fill="none" stroke="#3b7dff" stroke-width="1" />
  
  <!-- Photo 2 with Face Recognition -->
  <circle cx="335" cy="190" r="25" fill="none" stroke="#3b7dff" stroke-width="2" />
  <rect x="320" y="175" width="30" height="30" rx="15" fill="none" stroke="#3b7dff" stroke-width="1" />
  
  <circle cx="295" cy="220" r="20" fill="none" stroke="#3b7dff" stroke-width="2" />
  <rect x="285" y="210" width="20" height="20" rx="10" fill="none" stroke="#3b7dff" stroke-width="1" />
  
  <!-- Photo 3 with Face Recognition -->
  <circle cx="505" cy="210" r="28" fill="none" stroke="#3b7dff" stroke-width="2" />
  <rect x="487" y="192" width="36" height="36" rx="18" fill="none" stroke="#3b7dff" stroke-width="1" />
  
  <!-- Photo 5 with Face Recognition -->
  <circle cx="165" cy="350" r="30" fill="none" stroke="#3b7dff" stroke-width="2" />
  <rect x="145" y="330" width="40" height="40" rx="20" fill="none" stroke="#3b7dff" stroke-width="1" />
  
  <!-- Photo 6 with Face Recognition -->
  <circle cx="335" cy="330" r="25" fill="none" stroke="#3b7dff" stroke-width="2" />
  <rect x="320" y="315" width="30" height="30" rx="15" fill="none" stroke="#3b7dff" stroke-width="1" />
  
  <!-- Photo 7 with Face Recognition -->
  <circle cx="505" cy="350" r="28" fill="none" stroke="#3b7dff" stroke-width="2" />
  <rect x="487" y="332" width="36" height="36" rx="18" fill="none" stroke="#3b7dff" stroke-width="1" />
  
  <!-- Selected Face Panel -->
  <rect x="600" y="150" width="110" height="260" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="655" cy="190" r="30" fill="#e2e8f0" />
  <text x="655" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a">Иван Петров</text>
  
  <rect x="620" y="260" width="70" height="8" rx="4" fill="#cbd5e1" />
  <rect x="620" y="275" width="70" height="8" rx="4" fill="#cbd5e1" />
  <rect x="620" y="290" width="70" height="8" rx="4" fill="#cbd5e1" />
  
  <rect x="625" y="320" width="60" height="25" rx="4" fill="#3b7dff" />
  <text x="655" y="337" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Найти все</text>
  
  <!-- Status Bar -->
  <rect x="70" y="450" width="660" height="30" rx="4" fill="#f1f5f9" />
  <text x="90" y="470" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Найдено 7 фотографий с этим человеком</text>
</svg>