<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="#f8fafc" />
  
  <!-- Photo Frame -->
  <rect x="100" y="100" width="600" height="400" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Face Recognition Elements -->
  <!-- Person 1 -->
  <circle cx="250" cy="250" r="70" fill="#e2e8f0" />
  <circle cx="250" cy="250" r="70" fill="none" stroke="#3b7dff" stroke-width="3" stroke-dasharray="10 5" />
  <rect x="200" y="200" width="100" height="100" rx="50" fill="none" stroke="#3b7dff" stroke-width="2" />
  
  <!-- Person 2 -->
  <circle cx="450" cy="200" r="60" fill="#e2e8f0" />
  <circle cx="450" cy="200" r="60" fill="none" stroke="#3b7dff" stroke-width="3" stroke-dasharray="10 5" />
  <rect x="410" y="160" width="80" height="80" rx="40" fill="none" stroke="#3b7dff" stroke-width="2" />
  
  <!-- Person 3 -->
  <circle cx="550" cy="350" r="65" fill="#e2e8f0" />
  <circle cx="550" cy="350" r="65" fill="none" stroke="#3b7dff" stroke-width="3" stroke-dasharray="10 5" />
  <rect x="505" y="305" width="90" height="90" rx="45" fill="none" stroke="#3b7dff" stroke-width="2" />
  
  <!-- Face Recognition Lines -->
  <line x1="250" y1="250" x2="150" y2="450" stroke="#3b7dff" stroke-width="2" stroke-dasharray="5 3" />
  <line x1="450" y1="200" x2="350" y2="450" stroke="#3b7dff" stroke-width="2" stroke-dasharray="5 3" />
  <line x1="550" y1="350" x2="550" y2="450" stroke="#3b7dff" stroke-width="2" stroke-dasharray="5 3" />
  
  <!-- Data Points -->
  <rect x="100" y="450" width="600" height="50" rx="5" fill="white" stroke="#e2e8f0" stroke-width="2" />
  <circle cx="150" cy="475" r="10" fill="#3b7dff" />
  <rect x="170" y="470" width="80" height="10" rx="2" fill="#e2e8f0" />
  
  <circle cx="350" cy="475" r="10" fill="#3b7dff" />
  <rect x="370" y="470" width="80" height="10" rx="2" fill="#e2e8f0" />
  
  <circle cx="550" cy="475" r="10" fill="#3b7dff" />
  <rect x="570" y="470" width="80" height="10" rx="2" fill="#e2e8f0" />
</svg>